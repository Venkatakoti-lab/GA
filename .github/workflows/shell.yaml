name: shell-demo
on:
  workflow_dispatch:
jobs:
  shell_scripting:
    runs-on: ubuntu-latest 
    steps:
      - name: CheckOut The Code
        uses: actions/checkout@v6
      - name: Give perms to uptime.sh file 
        run: chmod +x uptime.sh
      - name: Execute The Shell Script 
        run: ./uptime.sh